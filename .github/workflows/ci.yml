name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: docker build --target runtime -t ohwawd:${{ github.sha }} .
      - run: docker build --target migrator -t ohwawd-migrator:${{ github.sha }} .
